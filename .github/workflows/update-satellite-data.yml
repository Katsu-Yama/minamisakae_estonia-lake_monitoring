name: Update Syouwa Lake satellite data

on:
  schedule:
    - cron: "17 3 */3 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      start_date:
        description: "開始日（YYYY-MM-DD、省略時は21日前）"
        required: false
        type: string
      end_date:
        description: "終了日（YYYY-MM-DD、省略時は実行日）"
        required: false
        type: string

concurrency:
  group: syouwa-lake-satellite-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEE_PROJECT_ID: ${{ vars.GEE_PROJECT_ID }}
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_IMAGE_BUCKET: satellite-images
      SUPABASE_CSV_BUCKET: satellite-csv
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      LOOKBACK_DAYS: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Process and upload satellite data
        run: python syouwa_lake_pipeline.py

      - name: Upload diagnostic output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syouwa-lake-failed-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
